<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <link rel="manifest" href="manifest.webmanifest?v=6">
  <link rel="stylesheet" href="styles.css?v=6">
  <title>Color Calendar</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="prevMonth" class="nav-button" type="button" aria-label="Previous month">‹</button>
      <h1 id="monthTitle"></h1>
      <button id="nextMonth" class="nav-button" type="button" aria-label="Next month">›</button>
    </header>

    <section class="calendar-wrap">
      <div class="weekday-row" aria-hidden="true">
        <span>MON</span><span>TUE</span><span>WED</span>
        <span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section class="summary" aria-label="Monthly color totals">
      <span><i class="dot green"></i>Green <b id="greenCount">0</b></span>
      <span><i class="dot red"></i>Red <b id="redCount">0</b></span>
      <span><i class="dot normal"></i>Normal <b id="normalCount">0</b></span>
    </section>
  </main>

  <script src="app.js?v=6" defer></script>
</body>
</html>
